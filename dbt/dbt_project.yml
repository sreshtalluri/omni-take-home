name: backlinks
version: "0.1.0"
profile: backlinks
model-paths: ["models"]
seed-paths: ["seeds"]

# Mirror etl/config.yaml's score_weights (0.5/0.3/0.2) and
# min_competitor_count (2) -- keep these two files in sync if either
# changes.
vars:
  weight_gap_breadth: 0.5
  weight_authority: 0.3
  weight_persistence: 0.2
  min_competitor_count: 2

models:
  backlinks:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  backlinks:
    category_overrides:
      # Task 9 populated this with the 25 top-ranked domains, each checked
      # against its actual site (see report/top_25_opportunities.md and
      # .superpowers/sdd/task-9-report.md for the curation log). Explicit
      # column_types kept even though the file has data rows now, in case a
      # future curation pass ever leaves it back at header-only -- dbt has
      # nothing to infer types from on a zero-row CSV.
      +column_types:
        source_domain: varchar
        category: varchar
