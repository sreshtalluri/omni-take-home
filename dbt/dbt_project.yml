name: backlinks
version: "0.1.0"
profile: backlinks
model-paths: ["models"]
seed-paths: ["seeds"]

# Single source of truth for scoring weights and the min-competitor
# filter: only dbt computes the score, so only dbt carries the values.
# scripts/generate_report.py reads the weights from this file when it
# re-scores merged duplicate rows -- never from a copy.
vars:
  weight_gap_breadth: 0.5
  weight_authority: 0.3
  weight_persistence: 0.2
  min_competitor_count: 2

models:
  backlinks:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  backlinks:
    category_overrides:
      # Site-verified category corrections for the top 25 domains, checked
      # against each domain's actual site -- see report/top_25_opportunities.md
      # for the result and report/actions.csv for the per-domain action
      # that came out of the same site-verification pass. Explicit
      # column_types kept even though the file has data rows now, in case a
      # future curation pass ever leaves it back at header-only -- dbt has
      # nothing to infer types from on a zero-row CSV.
      +column_types:
        source_domain: varchar
        category: varchar
