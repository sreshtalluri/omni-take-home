# profiles.yml -- checked in; local file db, no credentials.
#
# DUCKDB_PATH is an optional override for `path`, used only for
# throwaway/CI-style validation builds against a fixture-loaded DuckDB
# file. Left unset, `path` resolves to the project's real DuckDB file.
backlinks:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/backlinks.duckdb') }}"
      threads: 4
