[project]
name = "omni-take-home"
version = "0.1.0"
description = "Common Crawl backlink-opportunity pipeline (Omni growth take-home)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.10.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]
